[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lammps-live"
version = "0.1.0"
description = "Interactive real-time MD demos built on LAMMPS -- pull an atom onto a live, thermostatted 2D crystal with mouse or force-feedback joystick control."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pygame>=2.1",
    "lammps",
    "numpy",
    # GPU rendering of the 3D bead systems (sphere impostors + SSAO). Needs an
    # OpenGL 3.3+ core context; the app auto-falls back to the CPU renderer if
    # one can't be created. Pulls in `glcontext`.
    "moderngl>=5.8",
    # Sidewinder FF2 driver, consumed straight from its own repo rather than
    # vendored here, so the device protocol has a single home. Pulls in `hid`
    # itself; the native hidapi library still has to come from the OS package
    # manager (see README.md's Joystick setup section).
    # Only needed for --input joystick, but kept a hard dependency so a plain
    # `pip install -e .` gives a working joystick mode with no extra step.
    "sidewinder @ git+https://github.com/stefanhuber1993/sidewinder.git",
    # The config file (~/.config/lammps-live/config.toml) is TOML, which is in
    # the standard library from 3.11 on and a small package before it.
    "tomli>=1.2 ; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
lammps-live = "lammps_live.cli:main"

[tool.setuptools.packages.find]
include = ["lammps_live*"]

[tool.setuptools.package-data]
# Tabulated potentials, and the C++ sources for custom pair styles -- the plugin
# builder compiles those on demand from the installed tree, so they have to ship.
"lammps_live.forcefields" = ["data/*.eam"]
"lammps_live.forcefields.mesomem_ff" = ["*.cpp", "*.h"]
